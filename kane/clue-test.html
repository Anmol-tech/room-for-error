<!doctype html>
<!--
  Tonight's Kane check: can Kane read a clue on screen, use it, and report
  clearly when it doesn't work? The note says 4471; the keypad expects 4417.

  Serve:   npx serve kane   (or: python3 -m http.server -d kane 8080)
  Run:     kane-cli run --url http://localhost:8080/clue-test.html "Read the sticky note, enter the code it gives into the vault terminal, and verify the message says ACCESS GRANTED" --agent > kane/sample-output.ndjson
  Expect:  a FAILED result whose output mentions ACCESS DENIED / 4471.
  Then fix the note to 4417 and rerun: expect PASSED.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clue Test</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #111; color: #eee; max-width: 32rem; margin: 3rem auto; padding: 0 1rem; }
    .note { background: #ffe873; color: #222; padding: 1rem; transform: rotate(-2deg); width: 14rem; margin-bottom: 2rem; }
    .terminal { border: 2px solid #3cf; padding: 1rem; border-radius: 8px; }
    input, button { font-size: 1.2rem; padding: .4rem .8rem; }
    #result { margin-top: 1rem; font-weight: bold; min-height: 1.5rem; }
    .ok { color: #4f4; } .bad { color: #f55; }
  </style>
</head>
<body>
  <h1>Archive</h1>
  <div class="note" aria-label="Sticky note">Archive terminal: 4471. Don't forget again!</div>
  <div class="terminal">
    <label for="code">VAULT ACCESS: enter 4-digit code</label><br>
    <input id="code" inputmode="numeric" maxlength="4" autocomplete="off">
    <button id="submit" type="button">Submit code</button>
    <div id="result" role="status"></div>
  </div>
  <script>
    document.getElementById("submit").addEventListener("click", () => {
      const ok = document.getElementById("code").value.trim() === "4417";
      const result = document.getElementById("result");
      result.textContent = ok ? "ACCESS GRANTED" : "ACCESS DENIED";
      result.className = ok ? "ok" : "bad";
    });
  </script>
</body>
</html>
